<!DOCTYPE html>
<html>
    <head>
        <title>The Infinite Counter</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    </head>
    <body>

        <h1>The Infinite Counter of Doom 🚨</h1>
        <p>Loading Python... The alerts will start automatically.</p>

        <script type="py">
            from pyscript import window

            state = {"counter": 1}

            def trigger_doom_alert():
                window.alert(f"DOOM COUNTER: {state['counter']}")
                state["counter"] += 1

            window.setInterval(trigger_doom_alert, 500)
        </script>

    </body>
</html>
