<!DOCTYPE html>
<html>
    <head>
        <title>The Infinite Counter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h1>The Infinite Counter of Doom 🚨</h1>
        <h2 id="counter-display">Initializing Counter...</h2>

        <script>
            let counter = 1;

            function trigger_doom_counter() {
                const displayElement = document.getElementById("counter-display");
                if (displayElement) {
                    displayElement.innerHTML = "DOOM COUNTER: " + counter;
                    counter++;
                }
            }

            setInterval(trigger_doom_counter, 500);
        </script>

    </body>
</html>
