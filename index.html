<!DOCTYPE html>
<html>
    <head>
        <title>The Infinite Counter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h1>The Infinite Counter of Doom 🚨</h1>
        <h2 id="counter-display">Good Luck...</h2>

        <script>
            let counter = 1;

            function trigger_doom_alert() {
                alert(counter);
                counter++;
            }

            setInterval(trigger_doom_alert, 0);
        </script>

    </body>
</html>
